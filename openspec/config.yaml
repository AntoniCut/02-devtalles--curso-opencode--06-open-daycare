schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  Aplicación de gestión de guarderías (open-daycare). Objetivo: portar las maquetas
  HTML de references/pantallas/*.dc.html a rutas del App Router de Next.js manteniendo
  el estilo idéntico; references/screenshots/*.png son el objetivo visual de comparación.
  Stack: Next.js 16.3.3 (Turbopack) + React 19, App Router en app/, pnpm.
  Base de datos: Supabase con @supabase/supabase-js + @supabase/ssr; nunca drivers SQL
  directos ni ORMs. Los cambios de esquema siempre como migraciones versionadas.
  Navegación interna con next/link. Accesibilidad WCAG 2.2 AA.
  Comunicación con el usuario y artefactos en español.

